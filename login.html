<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Login | Nourish Nest Parent Portal</title>
  <meta name="description" content="Sign in to your Nourish Nest Parent Portal to manage weekly baby and toddler meals, delivery schedules, and allergy preferences.">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page-body" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-alt); padding: 80px 16px 32px; position: relative;">

  <!-- Top Navigation Controls (Top Right Theme & RTL Toggle) -->
  <header class="auth-top-nav">
    <div class="auth-top-controls">
      <button class="icon-circle-btn rtl-toggle-btn" aria-label="Toggle Direction" title="Toggle RTL/LTR"></button>
      <button class="icon-circle-btn theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Dark/Light Mode"></button>
    </div>
  </header>

  <!-- CENTERED LOGIN CARD -->
  <div class="auth-center-card" style="background: var(--bg-surface); width: 100%; max-width: 440px; border-radius: var(--radius-lg); padding: 40px 32px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-color); margin: auto;">
    
    <!-- BRAND LOGO BADGE -->
    <a href="index.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; text-decoration: none;">
      <div style="width: 44px; height: 44px; border-radius: var(--radius-md); background: var(--color-primary); color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <div style="text-align: left;">
        <div style="font-family: var(--font-heading); font-weight: 700; font-size: 1.15rem; color: var(--text-main); letter-spacing: 0.5px; line-height: 1.1;">NOURISH NEST</div>
        <div style="font-size: 0.65rem; font-weight: 700; color: var(--color-primary-dark); letter-spacing: 1.5px; text-transform: uppercase;">BABY & TODDLER MEALS</div>
      </div>
    </a>

    <!-- CARD HEADER -->
    <h2 style="font-family: var(--font-heading); text-align: center; color: var(--text-main); font-size: 1.75rem; font-weight: 700; margin-bottom: 4px;">Welcome Back</h2>
    <p class="text-muted" style="text-align: center; margin-bottom: 24px; font-size: 0.9rem;">
      Sign in to your parent learning portal.
    </p>

    <!-- LOGIN FORM -->
    <form id="login-form" style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label for="email" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Email Address</label>
        <input type="email" id="email" placeholder="parent@example.com" required style="width: 100%; padding: 13px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-alt); color: var(--text-main); font-size: 0.95rem; outline: none; transition: var(--transition);">
      </div>

      <div>
        <label for="password" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Password</label>
        <div style="position: relative;">
          <input type="password" id="password" placeholder="••••••••" required style="width: 100%; padding: 13px 40px 13px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); background: var(--bg-alt); color: var(--text-main); font-size: 0.95rem; outline: none; transition: var(--transition);">
          <button type="button" onclick="togglePasswordVisibility('password', this)" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px;" title="Toggle password visibility">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-top: 2px;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted);">
          <input type="checkbox" checked style="accent-color: var(--color-primary); width: 16px; height: 16px; border-radius: 4px;"> Remember me
        </label>
        <a href="#" class="auth-link" onclick="showToast('Password reset link sent in demo mode!')">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; padding: 14px; border-radius: var(--radius-md); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.5px; text-transform: uppercase;">
        SIGN IN
      </button>
    </form>

    <!-- DIVIDER -->
    <div style="display: flex; align-items: center; gap: 12px; margin: 22px 0;">
      <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
      <span style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">OR</span>
      <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
    </div>

    <!-- SOCIAL LOGINS -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <button type="button" class="btn-social" onclick="showToast('Google authentication demo mode')">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Google
      </button>
      <button type="button" class="btn-social" onclick="showToast('Apple authentication demo mode')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.67-.82 1.13-1.96.99-3.1-.97.04-2.16.65-2.85 1.46-.61.71-1.15 1.87-.99 2.98 1.09.08 2.21-.52 2.85-1.34z"/></svg>
        Apple
      </button>
    </div>

    <!-- FOOTER SWITCH LINK -->
    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;" class="text-muted">
      Don't have an account? <a href="register.html" class="auth-link-bold">Create Account</a>
    </div>

  </div>

  <script src="assets/js/main.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      }
    }
  </script>
</body>
</html>
